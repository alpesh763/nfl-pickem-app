<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password — NFL Weekly Picks</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section class="card">
    <h2>Choose a new password</h2>
    <p class="muted">Reset links work for 1 hour and can only be used once.</p>
    <form id="resetForm" method="post">
      <label>New password <span class="pwWrap"><input id="resetPassword" type="password" autocomplete="new-password"><button type="button" class="pwToggle" data-target="resetPassword" aria-label="Show password">👁</button></span></label>
      <label>Confirm new password <span class="pwWrap"><input id="resetConfirm" type="password" autocomplete="new-password"><button type="button" class="pwToggle" data-target="resetConfirm" aria-label="Show password">👁</button></span></label>
      <div class="row">
        <button type="submit" class="primary">Set new password</button>
      </div>
    </form>
    <p id="resetMsg" class="muted hidden"></p>
    <p id="resetError" class="error hidden"></p>
    <p id="resetDone" class="hidden"><a href="index.html">Sign in with your new password</a></p>
  </section>
</main>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
document.querySelectorAll('.pwToggle').forEach((btn) => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    btn.textContent = show ? '🙈' : '👁';
  });
});
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('resetMsg');
  const err = document.getElementById('resetError');
  msg.classList.add('hidden'); err.classList.add('hidden');
  const pw = document.getElementById('resetPassword').value;
  const cf = document.getElementById('resetConfirm').value;
  if (!token) { err.textContent = 'This reset link is missing its token. Use the full link from the email.'; err.classList.remove('hidden'); return; }
  if (pw !== cf) { err.textContent = 'Passwords do not match.'; err.classList.remove('hidden'); return; }
  if (pw.length < 4) { err.textContent = 'Password must be at least 4 characters.'; err.classList.remove('hidden'); return; }
  try {
    const res = await fetch('/api/reset-password', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || 'Could not reset the password.');
    msg.textContent = 'Password changed.';
    msg.classList.remove('hidden');
    document.getElementById('resetDone').classList.remove('hidden');
    document.getElementById('resetForm').classList.add('hidden');
  } catch (e2) {
    err.textContent = e2.message;
    err.classList.remove('hidden');
  }
});
</script>
</body>
</html>
